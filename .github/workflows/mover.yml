name: Ajustar SDK 33
on:
  push:
    paths:
      - '.github/workflows/mover.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/AndroidTargetSdkVersion: 0/AndroidTargetSdkVersion: 33/g' ProjectSettings/ProjectSettings.asset
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ProjectSettings/ProjectSettings.asset
          git commit -m "Definir Android SDK 33"
          git push
