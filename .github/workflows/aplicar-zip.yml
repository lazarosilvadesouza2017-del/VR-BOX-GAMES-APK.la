name: Aplicar zip
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair por cima
        run: |
          for z in *.zip; do unzip -o "$z" -x LEIA-ME-PATCH.txt; rm "$z"; done
          rm -f Assets/Plugins/Android/MPBridge.java
      - name: Salvar
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar atualizacao" || echo "nada a salvar"
          git push
