# Cole este arquivo em: .github/workflows/build-apk.yml (raiz do repositorio)
# Dispara: push na main, tag v*, ou manualmente (Actions > Build APK > Run workflow)
name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write          # necessario para criar a Release com o APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # O build do Unity + Android ocupa muito disco: libera espaco antes
      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache da pasta Library (acelera os proximos builds)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Compilar com Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.7f1
          targetPlatform: Android
          buildMethod: SpiderVR.Editor.BuildAndroid.Build
          androidExportType: androidPackage
          androidKeystoreName: ''
          allowDirtyBuild: true

      - name: Conferir se o APK foi gerado
        run: |
          ls -la build/Android
          test -f build/Android/SpiderVR.apk

      - name: Guardar APK em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpiderVR-apk
          path: build/Android/SpiderVR.apk
          retention-days: 30

      # So roda quando voce cria uma tag (ex.: v0.2.0): publica o APK em Releases
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SpiderVR ${{ github.ref_name }}
          body: |
            APK do SpiderVR (VR Box).
            Instale no celular e permita "fontes desconhecidas".
          files: build/Android/SpiderVR.apk
